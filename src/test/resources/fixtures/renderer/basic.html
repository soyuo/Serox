<!doctype html>
<html>
  <head>
    <style>
      body { margin: 8px; color: #222222; font-size: 16px; }
      #card { width: 140px; padding: 10px; margin: 4px; background-color: #f0f0f0; border: 1px solid #333333; }
      .card-title { font-size: 20px; font-weight: bold; color: #0b57d0; }
      p { margin: 4px 0px; }
      a { color: #0b57d0; text-decoration: underline; }
      #unsupported { display: grid; }
    </style>
  </head>
  <body>
    <main id="card">
      <h1 class="card-title">Serox Layout</h1>
      <p>repeatable content <a href="/docs">read docs</a></p>
      <img alt="visual sample" width="40" height="24">
    </main>
    <div id="unsupported">fallback text</div>
  </body>
</html>
