<!doctype html>
<html>
  <head>
    <style>
      body { margin: 0px; font-size: 14px; }
      .bar { display: flex; justify-content: space-between; align-items: center; padding: 8px; background-color: #0b57d0; color: #ffffff; }
      .cards { display: flex; gap: 8px; padding: 8px; }
      .card { flex: 1; padding: 6px; border: 1px solid #cccccc; background-color: #f6f7f9; }
      .stack { display: flex; flex-direction: column; gap: 4px; padding: 8px; align-items: center; }
      .pill { padding: 4px; background-color: #e6effe; }
    </style>
  </head>
  <body>
    <div class="bar"><strong>Serox</strong><span>menu</span></div>
    <div class="cards">
      <div class="card"><p>first card</p></div>
      <div class="card"><p>second card with longer text</p></div>
      <div class="card"><p>third</p></div>
    </div>
    <div class="stack"><div class="pill">one</div><div class="pill">two</div></div>
  </body>
</html>
