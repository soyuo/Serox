<!doctype html>
<html>
  <head>
    <title>Article</title>
    <style>
      body { margin: 0px; font-size: 16px; color: #111111; }
      header { background-color: #0b57d0; color: #ffffff; padding: 12px; }
      h2 { font-size: 22px; margin: 8px 0px; }
      ul { margin: 6px 0px; padding: 0px 0px 0px 16px; }
      li { margin: 2px 0px; }
      blockquote { margin: 6px 0px; padding: 4px; border: 1px solid #999999; background-color: #fafafa; }
      .muted { color: #666666; font-size: 12px; }
    </style>
  </head>
  <body>
    <header><h2>Release notes</h2><span class="muted">v1</span></header>
    <section>
      <p>Intro paragraph with <strong>bold</strong>, <em>italic</em> and <a href="https://example.test/">a link</a>.</p>
      <ul><li>first item</li><li>second item</li><li>third item</li></ul>
      <blockquote>Quoted text that is long enough to wrap onto more than one line of the viewport.</blockquote>
    </section>
    <script>document.write("must not render")</script>
    <p class="muted">footer note</p>
  </body>
</html>
